[versions]
kotlin = "2.2.0"
ktor = "3.3.1"
logback = "1.5.7"
sqldelight = "2.0.2"
kotlinx-serialization = "1.7.3"
bcrypt="0.10.2"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }

[libraries]
# Ktor Server
#ktor-server-core ={module = "io.ktor:ktor-server-engine-core",version.ref="ktor"}
ktor-server-core = { module = "io.ktor:ktor-server-core-jvm", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty-jvm", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation-jvm", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json-jvm", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages-jvm", version.ref = "ktor" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging-jvm", version.ref = "ktor" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth-jvm", version.ref = "ktor" }
ktor-server-resources = { module = "io.ktor:ktor-server-resources-jvm", version.ref = "ktor" }
ktor-server-auth-jwt={module="io.ktor:ktor-server-auth-jwt-jvm",version.ref="ktor"}

# Test
ktor-server-test-host={module ="io.ktor:ktor-server-test-host", version.ref="ktor"}

# Logging
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# KotlinX
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# SQLDelight (SQLite)
sqldelight-driver-jdbc = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-primitive-adapters = { module = "app.cash.sqldelight:primitive-adapters", version.ref = "sqldelight" }

# BCrypt
# at.favre.lib:bcrypt:0.10.2
crypt= {module = "at.favre.lib:bcrypt",version.ref="bcrypt"}
